<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" fill="#f8fafc">
  <rect width="400" height="300" fill="#e2e8f0"/>
  <!-- Metric grid table background -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)" />
  
  <!-- Seized phone representation -->
  <rect x="130" y="40" width="140" height="220" rx="20" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <rect x="142" y="60" width="116" height="175" rx="6" fill="#0f172a"/>
  
  <!-- Screen display mock -->
  <circle cx="200" cy="140" r="22" fill="#334155"/>
  <path d="M 192 135 L 208 135 M 200 127 L 200 143" stroke="#94a3b8" stroke-width="2"/>
  <text x="200" y="180" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">IMEI: 863920194829102</text>
  <text x="200" y="195" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Samsung Galaxy A54</text>
  
  <!-- Evidence Ruler and Tag -->
  <rect x="50" y="270" width="300" height="15" fill="#fef08a" stroke="#ca8a04" stroke-width="1"/>
  <text x="60" y="281" fill="#713f12" font-family="monospace" font-size="9">0cm  5cm  10cm  15cm  20cm  25cm  30cm</text>
  
  <rect x="290" y="50" width="95" height="40" rx="4" fill="#006a4e" stroke="#004f3a" stroke-width="1"/>
  <text x="337" y="67" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SEIZED ITEM</text>
  <text x="337" y="82" fill="#86efac" font-family="monospace" font-size="9" text-anchor="middle">SL #SZ-2026-88</text>
</svg>
